
<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#14251b">
<title>FitZone</title>
<style>
body{margin:0;background:#101812;color:#fff;font-family:Arial,sans-serif;padding:20px}
h1{color:#8bea68}h2{font-size:20px}
.card{background:#202d24;padding:16px;border-radius:14px;margin:12px 0}
button{background:#8bea68;color:#14251b;border:0;padding:12px;border-radius:9px;font-weight:bold}
li{margin:12px 0}progress{width:100%;height:18px}
</style>
</head>
<body>
<h1>💪 FitZone</h1>
<p>Your fitness journey starts here.</p>
<div class="card">
<h2>Today's workout</h2>
<label><input type="checkbox" onchange="update()"> Jumping jacks — 20 reps</label><br><br>
<label><input type="checkbox" onchange="update()"> Squats — 15 reps</label><br><br>
<label><input type="checkbox" onchange="update()"> Push-ups — 10 reps</label><br><br>
<label><input type="checkbox" onchange="update()"> Plank — 30 seconds</label>
<p id="count">0 of 4 completed</p>
<progress id="bar" value="0" max="4"></progress>
</div>
<div class="card">
<h2>💧 Water check-in</h2>
<p>Glasses today: <b id="water">0</b></p>
<button onclick="drink()">+ Add a glass</button>
</div>
<div class="card">
<h2>🎯 Daily motivation</h2>
<p>Small steps every day lead to progress. Keep going!</p>
</div>
<script>
function update(){
let boxes=[...document.querySelectorAll('input[type=checkbox]')];
let n=boxes.filter(b=>b.checked).length;
document.getElementById('count').textContent=n+' of 4 completed';
document.getElementById('bar').value=n;
}
let w=0;
function drink(){
w++;
document.getElementById('water').textContent=w;
}
</script>
</body>
</html>
