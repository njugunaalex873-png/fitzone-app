<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fitzone Fitness</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px 16px;
      background: #101b19;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 520px;
      margin: auto;
    }

    h1 { color: #aaff70; }

    section {
      background: #20332e;
      padding: 20px;
      border-radius: 16px;
      margin: 20px 0;
    }

    input {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border-radius: 8px;
      border: 1px solid #65776f;
    }

    button {
      background: #b7ff78;
      color: #17301b;
      padding: 12px 18px;
      margin: 5px 4px 5px 0;
      border: 0;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .exercise {
      display: block;
      padding: 10px 0;
    }

    progress {
      width: 100%;
      height: 14px;
      accent-color: #b7ff78;
    }

    #message { overflow-wrap: anywhere; }
  </style>
</head>

<body>
  <main>
    <h1>💪 Fitzone</h1>

    <section>
      <h2>🔐 Sign in to Fitzone</h2>

      <form id="authForm">
        <input id="email" type="email"
          placeholder="Email address" required>

        <input id="password" type="password"
          placeholder="Password" minlength="6" required>

        <button type="submit">Sign In</button>
        <button type="button" id="createAccount">
          Create Account
        </button>
      </form>

      <p id="message" role="status">
        Sign in or create your account.
      </p>
    </section>

    <p>Your fitness journey starts here.</p>

    <section>
      <h2>Today's workout</h2>

      <label class="exercise">
        <input type="checkbox" class="workout">
        Jumping jacks — 20 reps
      </label>

      <label class="exercise">
        <input type="checkbox" class="workout">
        Squats — 15 reps
      </label>

      <label class="exercise">
        <input type="checkbox" class="workout">
        Push-ups — 10 reps
      </label>

      <label class="exercise">
        <input type="checkbox" class="workout">
        Plank — 30 seconds
      </label>

      <p id="progressText">0 of 4 completed</p>
      <progress id="progressBar" value="0" max="4"></progress>
    </section>
  </main>

  <script type="module">
    // Keep JavaScript here, not as visible page text.
    const exercises = document.querySelectorAll(".workout");
    const progressText = document.getElementById("progressText");
    const progressBar = document.getElementById("progressBar");

    function updateProgress() {
      const completed = [...exercises]
        .filter(item => item.checked).length;

      progressText.textContent =
        `${completed} of ${exercises.length} completed`;

      progressBar.value = completed;
    }

    exercises.forEach(item =>
      item.addEventListener("change", updateProgress)
    );

    // Firebase authentication is added in the next step.
  </script>
</body>
</html>
