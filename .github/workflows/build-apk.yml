
name: Build FitZone Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Get FitZone source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: 'true'
          log-accepted-android-sdk-licenses: 'false'

      - name: Prepare FitZone website
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init FitZone com.fitzone.app --web-dir=www
          mkdir -p www
          cp index.html www/index.html

      - name: Configure Capacitor
        run: npx cap add android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: FitZone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      
      - name: Save APK for download
        uses: actions/upload-artifact@v4
        with:
          name: FitZone-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          overwrite: true

          
